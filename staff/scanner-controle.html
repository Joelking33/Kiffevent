      <header class="topbar">

              <path d="m21 21-4.3-4.3" />

        </div>
        <div class="topbar-right">
          <button class="topbar-icon-btn" aria-label="Notifications"><svg viewBox="0 0 24 24" fill="none"

              <path d="M6 8a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6Z" />
              <path d="M9.5 20a2.5 2.5 0 0 0 5 0" />
            </svg><span class="topbar-badge" data-notif-count>0</span></button>
          <button class="topbar-icon-btn" aria-label="Messages"><svg viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path
                d="M21 11.5a8.4 8.4 0 0 1-8.9 8.4 8.9 8.9 0 0 1-3.1-.6L3 21l1.8-5A8.3 8.3 0 0 1 3.5 11 8.4 8.4 0 0 1 12 3a8.4 8.4 0 0 1 9 8.5Z" />
            </svg></button>
          <div class="topbar-user">
            <div class="avatar">BF</div>
            <div>
              <div class="u-name">Bamba Fatou</div>
              <div class="u-role">Staff</div>
            </div>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round">
              <path d="m6 9 6 6 6-6" />
            </svg>
          </div>
        </div>

              <path d="M9.5 20a2.5 2.5 0 0 0 5 0" />
            </svg></button>
          <button aria-label="Profil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"

              <path d="m6 9 6 6 6-6" />
            </svg></button>
        </div>

          <div class="head-right-cards">

        <div class="scanner-layout">
          
          <div class="scanner-col">
            <div class="scanner-frame-card">
              <div class="scanner-frame-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                  stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="3" width="7" height="7" rx="1" />
                  <rect x="14" y="3" width="7" height="7" rx="1" />
                  <rect x="3" y="14" width="7" height="7" rx="1" />
                  <path d="M14 14h3v3h-3zM19 14h2M14 19h2M19 19h2" />
                </svg>
                <div><b>Scanner un QR code</b><span>Positionnez le QR code dans le cadre pour le scanner.</span></div>
              </div>
              <div class="scanner-viewport" id="scanner-viewport">
                <div class="scan-corner tl"></div>
                <div class="scan-corner tr"></div>
                <div class="scan-corner bl"></div>
                <div class="scan-corner br"></div>
                <div class="scan-laser"></div>
                <canvas id="qr-demo-canvas" width="220" height="220"></canvas>
              </div>
              <button class="torch-btn" id="torch-btn"><svg class="ui-icon" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"
                  aria-hidden="true">
                  <path d="M13 2 4.5 13.5H11L10 22l8.5-11.5H12L13 2Z" />
                </svg><span>Activer la lampe torche</span></button>
            </div>
          </div>
